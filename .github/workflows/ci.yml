name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-secret-key-not-for-production
        run: python -m pytest

  migrations:
    name: Migration drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pipstride
          POSTGRES_USER: pipstride
          POSTGRES_PASSWORD: pipstride
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipstride"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pipstride:pipstride@127.0.0.1:5432/pipstride
      ENVIRONMENT: test
      SECRET_KEY: ci-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Check models match migrations
        run: python scripts/check_migrations.py

      - name: Verify database backup and restore tool
        run: |
          python scripts/backup_db.py
          python scripts/backup_db.py --list
          BACKUP_FILE=$(find ../../backups -name "pipstride_backup_*.sql.gz" | head -n 1)
          python scripts/backup_db.py --verify "$BACKUP_FILE"
          python scripts/backup_db.py --restore "$BACKUP_FILE" --force

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t pipstride-api:ci services/api

      - name: Build web image
        run: docker build -t pipstride-web:ci apps/web
