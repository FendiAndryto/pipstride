services:
  postgres:
    image: postgres:16-alpine
    container_name: pipstride_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-pipstride}
      - POSTGRES_USER=${POSTGRES_USER:-pipstride}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pipstride_dev_password}
    ports:
      # Bound to loopback so the database is never exposed publicly.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipstride} -d ${POSTGRES_DB:-pipstride}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pipstride_net

  redis:
    image: redis:7-alpine
    container_name: pipstride_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - pipstride_net

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: pipstride_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8089}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://pipstride:pipstride_dev_password@postgres:5432/pipstride}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-default_secret_key_12345}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change_this_password}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - MT5_MAGIC_NUMBER=${MT5_MAGIC_NUMBER:-778899}
      - HEARTBEAT_TIMEOUT_SECONDS=${HEARTBEAT_TIMEOUT_SECONDS:-10}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_NOTIFICATIONS_ENABLED=${TELEGRAM_NOTIFICATIONS_ENABLED:-true}
      - MAX_DAILY_DRAWDOWN_PERCENT=${MAX_DAILY_DRAWDOWN_PERCENT:-3.0}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-}
      - MT5_MONITORED_SYMBOLS=${MT5_MONITORED_SYMBOLS:-XAUUSD,EURUSD,GBPUSD,USDJPY,BTCUSD}
      - MT5_HEARTBEAT_INTERVAL_SECONDS=${MT5_HEARTBEAT_INTERVAL_SECONDS:-1}
      - MT5_HISTORY_DAYS=${MT5_HISTORY_DAYS:-90}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-Pipstride <no-reply@pipstride.local>}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - EMAIL_RESET_TTL_MINUTES=${EMAIL_RESET_TTL_MINUTES:-30}
      - EMAIL_VERIFY_TTL_HOURS=${EMAIL_VERIFY_TTL_HOURS:-24}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - HEARTBEAT_RATE_LIMIT=${HEARTBEAT_RATE_LIMIT:-120}
      - HEARTBEAT_RATE_WINDOW_SECONDS=${HEARTBEAT_RATE_WINDOW_SECONDS:-10}
      - SNAPSHOT_RETENTION_DAYS=${SNAPSHOT_RETENTION_DAYS:-180}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pipstride_net

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: pipstride_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
    networks:
      - pipstride_net

networks:
  pipstride_net:
    name: pipstride_network
    driver: bridge

volumes:
  postgres_data:
    name: pipstride_postgres_data
  redis_data:
    name: pipstride_redis_data
